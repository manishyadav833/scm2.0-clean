
<!DOCTYPE html>
<html
        class="light"
        lang="en"
        th:fragment="parent(content,title,script)"
        xmlns:th="http://www.thymeleaf.org"
>
<head><style>
    body {
        background: linear-gradient(to right, #e0f2fe, #f8fafc);
        font-family: 'Segoe UI', sans-serif;
    }

    /* main content */
    #content {
        padding: 60px 20px;
        text-align: center;
    }

    /* heading */
    #content h1 {
        font-size: 36px;
        margin-bottom: 10px;
        font-weight: 600;
    }

    /* paragraph */
    #content p {
        color: #555;
        margin-bottom: 40px;
    }

    /* layout */
    .features {
        display: flex;
        justify-content: center;
        gap: 30px;
        flex-wrap: wrap;
    }

    /* cards */
    .box {
        width: 260px;
        background: white;
        padding: 25px;
        border-radius: 18px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        transition: all 0.3s ease;
        cursor: pointer;
    }

    /* hover effect */
    .box:hover {
        transform: translateY(-10px) scale(1.03);
        box-shadow: 0 20px 40px rgba(0,0,0,0.15);
    }

    /* icons / title */
    .box h3 {
        margin-bottom: 10px;
        color: #2563eb;
    }

    /* text */
    .box p {
        font-size: 14px;
        color: #666;
    }
    /* heading center spacing improve */
#content h1 {
    font-size: 36px;
    margin-bottom: 5px;
}

#content p {
    font-size: 16px;
    color: #555;
    margin-bottom: 40px;
}

/* grid feel (optional upgrade 🔥) */
.features {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 25px;
    padding: 0 40px;
}
</style>

     <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-th-replace="${title}">SCM</title>

    <link
            href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.css"
            rel="stylesheet"
    />
    <link rel="stylesheet" data-th-href="@{'/css/output.css'}" />
    <link rel="stylesheet" data-th-href="@{'/css/style.css'}" />

    <!-- font awesome -->
    <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
            integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
    />
</head>
<body class="dark:bg-gray-900 bg-gray-100 dark:text-white">
<!-- commona header -->

<!--  user is logged in : navbar -->
<div th:if="${loggedInUser}">
    <div data-th-replace="~{user/user_navbar::user-navbar}"></div>
</div>

<!-- user is not logged : navbar -->
<div th:unless="${loggedInUser}">
    <div data-th-replace="~{navbar :: navbar}"></div>
</div>

<!-- main content -->
<div class="">
    <section data-th-replace="${content}"></section>
</div>
<!-- flow bite content -->

<!-- common footer -->
<!-- <footer class="p-4">Footer: Learn Code With Durgesh</footer> -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script data-th-src="@{'/js/script.js'}"></script>
<th:block data-th-replace="${script}"></th:block>
</body>
</html>
