<!DOCTYPE html>
<html>
<head>
    <title>Messages</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
            background: #f5f7fb;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        /* LEFT SIDE */
        .contacts {
            width: 30%;
            background: #1e293b;
            color: white;
            padding: 20px;
        }

        .contacts h3 {
            margin-bottom: 15px;
        }

        .contacts ul {
            list-style: none;
            padding: 0;
        }

        .contacts li {
            padding: 10px;
            margin-bottom: 10px;
            background: #334155;
            border-radius: 8px;
            cursor: pointer;
        }

        .contacts li:hover {
            background: #475569;
        }

        /* RIGHT SIDE */
        .chat {
            width: 70%;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .chat-header {
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 10px;
        }

        .chat-box {
            flex: 1;
            background: white;
            padding: 15px;
            border-radius: 10px;
            overflow-y: auto;
            box-shadow: 0 0 5px rgba(0,0,0,0.1);
        }

        .message {
            margin: 10px 0;
        }

        .you {
            text-align: right;
            color: #2563eb;
        }

        .input-area {
            display: flex;
            margin-top: 10px;
        }

        .input-area input {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        .input-area button {
            margin-left: 10px;
            padding: 10px 15px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .input-area button:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>

<div class="container">

    <!-- LEFT -->
    <div class="contacts">
        <h3>Contacts</h3>
        <ul>
            <li onclick="selectUser('Manish')">Manish</li>
        </ul>
    </div>

    <!-- RIGHT -->
    <div class="chat">

        <div class="chat-header" id="chatUser">Select User</div>

        <div class="chat-box" id="chatBox"></div>

        <div class="input-area">
            <input type="text" id="msg" placeholder="Type message..." />
            <button onclick="sendMsg()">Send</button>
        </div>

    </div>

</div>

<script>
    let user = "";

    function selectUser(name){
        user = name;
        document.getElementById("chatUser").innerText = name;
        document.getElementById("chatBox").innerHTML = "";
    }

    function sendMsg(){
        let msg = document.getElementById("msg").value;

        if(msg === "") return;

        let box = document.getElementById("chatBox");

        box.innerHTML += `<div class="message you">You: ${msg}</div>`;

        document.getElementById("msg").value = "";
    }
</script>

</body>
</html>
