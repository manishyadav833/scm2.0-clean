<div class="dashboard">

    <h1>Welcome, Manish 👋</h1>
    <p class="subtitle">Manage your contacts easily with SCM</p>

    <div class="cards">

        <div class="card blue">
            <h3>Total Contacts</h3>
            <p>3</p>
        </div>

        <div class="card green">
            <h3>Favorites</h3>
            <p>1</p>
        </div>

        <div class="card orange">
            <h3>Messages</h3>
            <p>0</p>
        </div>

    </div>

</div>

<style>
    body {
        margin: 0;
        font-family: Arial;
        background: linear-gradient(to right, #eef2ff, #f8fafc);
    }

    /* Main */
    .dashboard {
        padding: 30px;
    }

    .dashboard h1 {
        font-size: 32px;
    }

    .subtitle {
        color: gray;
        margin-bottom: 25px;
    }

    /* Cards */
    .cards {
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
    }

    .card {
        flex: 1;
        min-width: 220px;
        padding: 25px;
        border-radius: 12px;
        color: white;
        box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        transition: 0.3s;
    }

    .card:hover {
        transform: translateY(-5px);
    }

    /* Colors */
    .blue {
        background: linear-gradient(135deg, #3b82f6, #1d4ed8);
    }

    .green {
        background: linear-gradient(135deg, #10b981, #047857);
    }

    .orange {
        background: linear-gradient(135deg, #f59e0b, #d97706);
    }

    .card h3 {
        margin-bottom: 10px;
    }

    .card p {
        font-size: 28px;
        font-weight: bold;
    }
</style>
